<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="avatarGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="shapeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" fill="url(#avatarGrad1)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="40" r="60" fill="rgba(255,255,255,0.06)"/>
  <circle cx="40" cy="200" r="80" fill="rgba(255,255,255,0.04)"/>
  <circle cx="120" cy="120" r="90" fill="rgba(255,255,255,0.03)"/>

  <!-- Large initial -->
  <text x="120" y="148" fill="#ffffff" font-size="96" font-weight="800" text-anchor="middle" letter-spacing="-4">D</text>

  <!-- Name tag at bottom -->
  <rect x="28" y="186" width="184" height="36" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="120" y="199" fill="rgba(255,255,255,0.7)" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="2">FOUNDER</text>
  <text x="120" y="215" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Devansh Dubey</text>
</svg>
