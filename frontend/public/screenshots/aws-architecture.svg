<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="32" fill="#1e293b" font-size="16" font-weight="800" text-anchor="middle">AWS Production Architecture — RDP Platform</text>
  <text x="400" y="50" fill="#64748b" font-size="12" text-anchor="middle">Multi-account · EKS · Terraform IaC · 99.95% uptime target</text>

  <!-- Users -->
  <rect x="340" y="62" width="120" height="36" rx="8" fill="#1e40af"/>
  <text x="400" y="84" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">👤 Users (60K+)</text>

  <!-- Arrow down to Route53 -->
  <line x1="400" y1="98" x2="400" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Route53 -->
  <rect x="326" y="118" width="148" height="36" rx="8" fill="#7c3aed"/>
  <text x="400" y="140" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">🌐 Route 53 (DNS)</text>

  <!-- Arrow down to CloudFront -->
  <line x1="400" y1="154" x2="400" y2="174" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CloudFront CDN -->
  <rect x="290" y="174" width="220" height="36" rx="8" fill="#0891b2"/>
  <text x="400" y="196" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">☁ CloudFront CDN + WAF</text>

  <!-- Arrow down -->
  <line x1="400" y1="210" x2="400" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AWS VPC boundary -->
  <rect x="30" y="230" width="740" height="310" rx="14" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="52" y="254" fill="#94a3b8" font-size="12" font-weight="600">AWS VPC (10.0.0.0/16)</text>

  <!-- Public Subnet -->
  <rect x="44" y="258" width="712" height="84" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="60" y="276" fill="#1e40af" font-size="11" font-weight="700">PUBLIC SUBNET</text>

  <!-- ALB box -->
  <rect x="276" y="280" width="248" height="44" rx="8" fill="#1e40af"/>
  <text x="400" y="298" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">⚖ Application Load Balancer (ALB)</text>
  <text x="400" y="313" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle">Path-based routing · SSL termination · WAF</text>

  <!-- NAT Gateway -->
  <rect x="570" y="280" width="168" height="44" rx="8" fill="#6366f1"/>
  <text x="654" y="299" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">🔒 NAT Gateway</text>
  <text x="654" y="314" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle">Outbound traffic</text>

  <!-- Bastion -->
  <rect x="60" y="280" width="148" height="44" rx="8" fill="#374151"/>
  <text x="134" y="299" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">🖥 Bastion Host</text>
  <text x="134" y="314" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle">VPN · SSH access</text>

  <!-- Arrow from ALB down to EKS -->
  <line x1="400" y1="324" x2="400" y2="368" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Private Subnet -->
  <rect x="44" y="356" width="712" height="176" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="374" fill="#166534" font-size="11" font-weight="700">PRIVATE SUBNET</text>

  <!-- EKS Cluster box -->
  <rect x="56" y="382" width="470" height="134" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="72" y="400" fill="#166534" font-size="11" font-weight="700">Amazon EKS Cluster (Kubernetes v1.30) — HPA + Cluster Autoscaler</text>

  <!-- EKS Pods -->
  <rect x="70" y="408" width="96" height="96" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="118" y="432" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">API Pod</text>
  <text x="118" y="448" fill="#166534" font-size="10" text-anchor="middle">NestJS</text>
  <rect x="118" y="458" width="0" height="0"/>
  <text x="118" y="462" fill="#166534" font-size="10" text-anchor="middle">x3 replicas</text>
  <text x="118" y="495" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">● Running</text>

  <rect x="176" y="408" width="96" height="96" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="224" y="432" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Stream Pod</text>
  <text x="224" y="448" fill="#166534" font-size="10" text-anchor="middle">HLS/DASH</text>
  <text x="224" y="462" fill="#166534" font-size="10" text-anchor="middle">x5 replicas</text>
  <text x="224" y="495" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">● Running</text>

  <rect x="282" y="408" width="96" height="96" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="330" y="432" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Chat Pod</text>
  <text x="330" y="448" fill="#166534" font-size="10" text-anchor="middle">EMQX/WS</text>
  <text x="330" y="462" fill="#166534" font-size="10" text-anchor="middle">x4 replicas</text>
  <text x="330" y="495" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">● Running</text>

  <rect x="388" y="408" width="96" height="96" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="436" y="432" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">Worker Pod</text>
  <text x="436" y="448" fill="#92400e" font-size="10" text-anchor="middle">Jobs/Queue</text>
  <text x="436" y="462" fill="#92400e" font-size="10" text-anchor="middle">x2 replicas</text>
  <text x="436" y="495" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">● Scaling</text>

  <!-- RDS -->
  <rect x="548" y="382" width="140" height="56" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="618" y="402" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">🗄 Amazon RDS</text>
  <text x="618" y="418" fill="#92400e" font-size="10" text-anchor="middle">PostgreSQL · Multi-AZ</text>
  <text x="618" y="432" fill="#92400e" font-size="10" text-anchor="middle">Cross-region backup</text>

  <!-- ElastiCache -->
  <rect x="548" y="448" width="140" height="48" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
  <text x="618" y="468" fill="#9d174d" font-size="11" font-weight="700" text-anchor="middle">⚡ ElastiCache</text>
  <text x="618" y="482" fill="#9d174d" font-size="10" text-anchor="middle">Redis · Session cache</text>

  <!-- S3 + Arrow -->
  <rect x="548" y="506" width="140" height="8" rx="4" fill="#f1f5f9"/>

  <!-- Bottom row: S3, CloudWatch, GitHub Actions -->
  <rect x="44" y="548" width="170" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="129" y="568" fill="#c2410c" font-size="12" font-weight="700" text-anchor="middle">📦 Amazon S3</text>
  <text x="129" y="583" fill="#c2410c" font-size="11" text-anchor="middle">Assets · Logs · Backups</text>

  <rect x="230" y="548" width="170" height="44" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="315" y="568" fill="#0369a1" font-size="12" font-weight="700" text-anchor="middle">📊 CloudWatch</text>
  <text x="315" y="583" fill="#0369a1" font-size="11" text-anchor="middle">Logs · Alarms · Metrics</text>

  <rect x="416" y="548" width="170" height="44" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="501" y="568" fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle">⚙ GitHub Actions</text>
  <text x="501" y="583" fill="#7e22ce" font-size="11" text-anchor="middle">CI/CD · Blue-green deploy</text>

  <rect x="602" y="548" width="170" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="687" y="568" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">🔭 Grafana + Prometheus</text>
  <text x="687" y="583" fill="#166534" font-size="11" text-anchor="middle">Observability · Alerting</text>
</svg>
