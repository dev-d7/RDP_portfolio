  <text x="360" y="215" fill="#64748b" font-size="11" font-weight="600">DEPARTMENT</text>
  <text x="492" y="215" fill="#64748b" font-size="11" font-weight="600">STATUS</text>
  <text x="570" y="215" fill="#64748b" font-size="11" font-weight="600">JOINED</text>

  <!-- Row 1 -->
  <rect x="196" y="226" width="416" height="34" fill="#ffffff"/>
  <circle cx="218" cy="243" r="10" fill="#3b82f6"/>
  <text x="218" y="247" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">A</text>
  <text x="234" y="247" fill="#1e293b" font-size="12" font-weight="600">Arjun Sharma</text>
  <text x="360" y="247" fill="#64748b" font-size="12">Engineering</text>
  <rect x="490" y="234" width="52" height="18" rx="9" fill="#d1fae5"/>
  <text x="516" y="247" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Active</text>
  <text x="570" y="247" fill="#94a3b8" font-size="12">Jan 2025</text>

  <!-- Divider -->
