  <!-- Row 2 -->
  <circle cx="218" cy="277" r="10" fill="#8b5cf6"/>
  <text x="218" y="281" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">P</text>
  <text x="234" y="281" fill="#1e293b" font-size="12" font-weight="600">Priya Nair</text>
  <text x="360" y="281" fill="#64748b" font-size="12">Marketing</text>
  <rect x="490" y="268" width="52" height="18" rx="9" fill="#d1fae5"/>
  <text x="516" y="281" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Active</text>
  <text x="570" y="281" fill="#94a3b8" font-size="12">Mar 2025</text>

  <!-- Divider -->
  <rect x="196" y="294" width="416" height="1" fill="#f1f5f9"/>

  <!-- Row 3 -->
  <circle cx="218" cy="311" r="10" fill="#f59e0b"/>
  <text x="218" y="315" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">R</text>
  <text x="234" y="315" fill="#1e293b" font-size="12" font-weight="600">Rahul Mehta</text>
  <text x="360" y="315" fill="#64748b" font-size="12">Finance</text>
  <rect x="490" y="302" width="58" height="18" rx="9" fill="#fef3c7"/>
  <text x="519" y="315" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">On Leave</text>
  <text x="570" y="315" fill="#94a3b8" font-size="12">Jun 2025</text>

  <!-- Divider -->
  <rect x="196" y="328" width="416" height="1" fill="#f1f5f9"/>

  <!-- Row 4 -->
  <circle cx="218" cy="345" r="10" fill="#10b981"/>
  <text x="218" y="349" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">S</text>
  <text x="234" y="345" fill="#1e293b" font-size="12" font-weight="600">Sneha Patil</text>
  <text x="360" y="345" fill="#64748b" font-size="12">Product</text>
  <rect x="490" y="336" width="52" height="18" rx="9" fill="#d1fae5"/>
  <text x="516" y="349" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Active</text>
  <text x="570" y="349" fill="#94a3b8" font-size="12">Aug 2025</text>

  <!-- Divider -->
  <rect x="196" y="362" width="416" height="1" fill="#f1f5f9"/>

  <!-- Row 5 -->
  <circle cx="218" cy="379" r="10" fill="#e11d48"/>
  <text x="218" y="383" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">K</text>
  <text x="234" y="379" fill="#1e293b" font-size="12" font-weight="600">Kiran Rao</text>
  <text x="360" y="379" fill="#64748b" font-size="12">Design</text>
  <rect x="490" y="370" width="52" height="18" rx="9" fill="#d1fae5"/>
  <text x="516" y="383" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">Active</text>
  <text x="570" y="383" fill="#94a3b8" font-size="12">Oct 2025</text>

  <!-- View all link -->
  <text x="380" y="421" fill="#3b82f6" font-size="12" font-weight="600" text-anchor="middle">View all employees →</text>

  <!-- Right side: Attendance chart -->
  <rect x="624" y="164" width="164" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="640" y="184" fill="#1e293b" font-size="13" font-weight="700">Attendance Rate</text>
  <text x="640" y="200" fill="#94a3b8" font-size="11">This week</text>

  <!-- Donut chart placeholder -->
  <circle cx="706" cy="252" r="36" fill="none" stroke="#e2e8f0" stroke-width="10"/>
  <circle cx="706" cy="252" r="36" fill="none" stroke="#10b981" stroke-width="10"
    stroke-dasharray="209 226" stroke-dashoffset="56" stroke-linecap="round"/>
  <text x="706" y="256" fill="#1e293b" font-size="16" font-weight="800" text-anchor="middle">93%</text>
  <text x="706" y="272" fill="#94a3b8" font-size="10" text-anchor="middle">present</text>

  <!-- Payroll summary card -->
  <rect x="624" y="306" width="164" height="90" rx="10" fill="#1e293b"/>
  <text x="640" y="326" fill="rgba(255,255,255,0.7)" font-size="11">MONTHLY PAYROLL</text>
  <text x="640" y="352" fill="#ffffff" font-size="20" font-weight="800">₹48.2L</text>
  <text x="640" y="370" fill="rgba(255,255,255,0.5)" font-size="11">248 employees · Jun 2026</text>
  <rect x="638" y="380" width="60" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="638" y="380" width="42" height="10" rx="3" fill="#3b82f6"/>

  <!-- Leave summary -->
  <rect x="624" y="408" width="164" height="26" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="640" y="425" fill="#92400e" font-size="11" font-weight="600">⚠ 8 pending approvals</text>
</svg>
