<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f1f5f9"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="185" height="450" fill="url(#sideGrad)"/>

  <!-- Logo -->
  <rect x="16" y="16" width="28" height="28" rx="7" fill="rgba(255,255,255,0.2)"/>
  <text x="30" y="35" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">R</text>
  <text x="52" y="35" fill="#fff" font-size="15" font-weight="700">HRMS</text>

  <!-- Nav items -->
  <rect x="0" y="68" width="185" height="36" fill="rgba(255,255,255,0.15)" rx="0"/>
  <rect x="12" y="78" width="14" height="14" rx="3" fill="rgba(255,255,255,0.7)"/>
  <text x="34" y="90" fill="#fff" font-size="13" font-weight="600">Dashboard</text>

  <rect x="12" y="118" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="130" fill="rgba(255,255,255,0.7)" font-size="13">Employees</text>

  <rect x="12" y="154" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="166" fill="rgba(255,255,255,0.7)" font-size="13">Attendance</text>

  <rect x="12" y="190" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="202" fill="rgba(255,255,255,0.7)" font-size="13">Payroll</text>

  <rect x="12" y="226" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="238" fill="rgba(255,255,255,0.7)" font-size="13">Leave Mgmt</text>

  <rect x="12" y="262" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="274" fill="rgba(255,255,255,0.7)" font-size="13">Performance</text>

  <rect x="12" y="298" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="310" fill="rgba(255,255,255,0.7)" font-size="13">Onboarding</text>

  <rect x="12" y="334" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="346" fill="rgba(255,255,255,0.7)" font-size="13">Reports</text>

  <!-- Bottom sidebar item -->
  <rect x="12" y="406" width="14" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="34" y="418" fill="rgba(255,255,255,0.7)" font-size="13">Settings</text>

  <!-- Main content area -->
  <!-- Top header -->
  <rect x="185" y="0" width="615" height="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="204" y="32" fill="#1e293b" font-size="17" font-weight="700">Dashboard</text>
  <text x="204" y="47" fill="#94a3b8" font-size="12">Monday, 8 June 2026</text>

  <!-- Top right actions -->
  <rect x="610" y="13" width="80" height="28" rx="14" fill="#3b82f6"/>
  <text x="650" y="32" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">+ Add Employee</text>

  <!-- Search -->
  <rect x="460" y="14" width="140" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="478" y="31" fill="#94a3b8" font-size="12">🔍 Search…</text>

  <!-- Notification bell + avatar -->
  <text x="700" y="34" fill="#64748b" font-size="17">🔔</text>
  <circle cx="740" cy="27" r="14" fill="#3b82f6"/>
  <text x="740" y="32" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">D</text>

  <!-- KPI Cards row -->
  <!-- Card 1: Total Employees -->
  <rect x="196" y="68" width="130" height="82" rx="10" fill="url(#cardBlue)"/>
  <text x="212" y="90" fill="rgba(255,255,255,0.8)" font-size="11">TOTAL EMPLOYEES</text>
  <text x="212" y="118" fill="#ffffff" font-size="28" font-weight="800">248</text>
  <text x="212" y="137" fill="rgba(255,255,255,0.7)" font-size="11">↑ 4 this month</text>

  <!-- Card 2: Present Today -->
  <rect x="338" y="68" width="130" height="82" rx="10" fill="url(#cardGreen)"/>
  <text x="354" y="90" fill="rgba(255,255,255,0.8)" font-size="11">PRESENT TODAY</text>
  <text x="354" y="118" fill="#ffffff" font-size="28" font-weight="800">231</text>
  <text x="354" y="137" fill="rgba(255,255,255,0.7)" font-size="11">93.1% attendance</text>

  <!-- Card 3: On Leave -->
  <rect x="480" y="68" width="130" height="82" rx="10" fill="url(#cardOrange)"/>
  <text x="496" y="90" fill="rgba(255,255,255,0.8)" font-size="11">ON LEAVE</text>
  <text x="496" y="118" fill="#ffffff" font-size="28" font-weight="800">12</text>
  <text x="496" y="137" fill="rgba(255,255,255,0.7)" font-size="11">3 approved today</text>

  <!-- Card 4: Pending Approvals -->
  <rect x="622" y="68" width="166" height="82" rx="10" fill="url(#cardPurple)"/>
  <text x="638" y="90" fill="rgba(255,255,255,0.8)" font-size="11">PENDING APPROVALS</text>
  <text x="638" y="118" fill="#ffffff" font-size="28" font-weight="800">8</text>
  <text x="638" y="137" fill="rgba(255,255,255,0.7)" font-size="11">Leave &amp; reimbursements</text>

  <!-- Employee Table -->
  <rect x="196" y="164" width="416" height="270" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="212" y="186" fill="#1e293b" font-size="14" font-weight="700">Recent Employees</text>

  <!-- Table header -->
  <rect x="196" y="196" width="416" height="30" fill="#f8fafc"/>
