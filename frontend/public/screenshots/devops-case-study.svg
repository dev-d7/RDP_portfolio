<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'JetBrains Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2035"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
  </defs>

  <!-- Background (Grafana dark) -->
  <rect width="800" height="600" fill="#111827"/>

  <!-- Top header bar -->
  <rect width="800" height="44" fill="#1f2937"/>
  <rect x="0" y="43" width="800" height="1" fill="#374151"/>

  <!-- Grafana logo area -->
  <rect x="10" y="10" width="24" height="24" rx="4" fill="#f97316"/>
  <text x="22" y="26" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">G</text>
  <text x="40" y="28" fill="#e5e7eb" font-size="13" font-weight="700">Grafana</text>

  <!-- Dashboard name -->
  <text x="400" y="28" fill="#f9fafb" font-size="14" font-weight="700" text-anchor="middle">RDP Platform — Production Observability</text>

  <!-- Time range -->
  <rect x="604" y="8" width="140" height="28" rx="5" fill="#374151"/>
  <text x="674" y="27" fill="#d1d5db" font-size="11" text-anchor="middle">Last 1 hour ↻</text>

  <!-- Alert status -->
  <rect x="752" y="8" width="40" height="28" rx="5" fill="#065f46"/>
  <text x="772" y="27" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">OK</text>

  <!-- === ROW 1: Stat panels === -->

  <!-- Panel: Concurrent Users -->
  <rect x="8" y="52" width="150" height="72" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="16" y="70" fill="#9ca3af" font-size="10">Concurrent Users</text>
  <text x="16" y="104" fill="#34d399" font-size="30" font-weight="800">62,841</text>
  <text x="16" y="117" fill="#6ee7b7" font-size="10">↑ 12.4% vs 1h ago</text>

  <!-- Panel: Request Rate -->
  <rect x="166" y="52" width="150" height="72" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="174" y="70" fill="#9ca3af" font-size="10">Req/sec (ALB)</text>
  <text x="174" y="104" fill="#60a5fa" font-size="30" font-weight="800">48,204</text>
  <text x="174" y="117" fill="#93c5fd" font-size="10">p99 latency: 87ms</text>

  <!-- Panel: Error Rate -->
  <rect x="324" y="52" width="150" height="72" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="332" y="70" fill="#9ca3af" font-size="10">Error Rate</text>
  <text x="332" y="104" fill="#34d399" font-size="30" font-weight="800">0.02%</text>
  <text x="332" y="117" fill="#6ee7b7" font-size="10">↓ below SLO threshold</text>

  <!-- Panel: EKS Pods Running -->
  <rect x="482" y="52" width="150" height="72" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="490" y="70" fill="#9ca3af" font-size="10">EKS Pods Running</text>
  <text x="490" y="104" fill="#a78bfa" font-size="30" font-weight="800">42 / 42</text>
  <text x="490" y="117" fill="#c4b5fd" font-size="10">HPA: 4 nodes scaled up</text>

  <!-- Panel: Uptime -->
  <rect x="640" y="52" width="152" height="72" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="648" y="70" fill="#9ca3af" font-size="10">Uptime (30d)</text>
  <text x="648" y="104" fill="#34d399" font-size="30" font-weight="800">99.97%</text>
  <text x="648" y="117" fill="#6ee7b7" font-size="10">0 incidents this month</text>

  <!-- === ROW 2: Charts === -->

  <!-- Panel: HTTP Requests time-series (large) -->
  <rect x="8" y="132" width="490" height="160" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="16" y="150" fill="#d1d5db" font-size="11" font-weight="700">HTTP Request Rate (req/s)</text>
  <text x="16" y="165" fill="#6b7280" font-size="10">ALB · EKS Ingress · Last 1h</text>

  <!-- X axis labels -->
  <text x="28" y="282" fill="#6b7280" font-size="9">-60m</text>
  <text x="110" y="282" fill="#6b7280" font-size="9">-50m</text>
  <text x="190" y="282" fill="#6b7280" font-size="9">-40m</text>
  <text x="270" y="282" fill="#6b7280" font-size="9">-30m</text>
  <text x="350" y="282" fill="#6b7280" font-size="9">-20m</text>
  <text x="430" y="282" fill="#6b7280" font-size="9">-10m</text>
  <text x="480" y="282" fill="#6b7280" font-size="9">now</text>

  <!-- Horizontal grid lines -->
  <line x1="16" y1="175" x2="492" y2="175" stroke="#1f2937" stroke-width="1"/>
  <line x1="16" y1="198" x2="492" y2="198" stroke="#1f2937" stroke-width="1"/>
  <line x1="16" y1="220" x2="492" y2="220" stroke="#1f2937" stroke-width="1"/>
  <line x1="16" y1="242" x2="492" y2="242" stroke="#1f2937" stroke-width="1"/>
  <line x1="16" y1="265" x2="492" y2="265" stroke="#1f2937" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="12" y="178" fill="#6b7280" font-size="9" text-anchor="end">60K</text>
  <text x="12" y="200" fill="#6b7280" font-size="9" text-anchor="end">45K</text>
  <text x="12" y="222" fill="#6b7280" font-size="9" text-anchor="end">30K</text>
  <text x="12" y="244" fill="#6b7280" font-size="9" text-anchor="end">15K</text>
  <text x="12" y="266" fill="#6b7280" font-size="9" text-anchor="end">0</text>

  <!-- Request rate line (main) -->
  <polyline points="28,248 55,240 82,235 109,228 136,220 163,218 190,222 217,210 244,200 271,195 298,190 325,185 352,182 379,180 406,183 433,178 460,175 487,177" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <!-- Fill under the line -->
  <polygon points="28,265 28,248 55,240 82,235 109,228 136,220 163,218 190,222 217,210 244,200 271,195 298,190 325,185 352,182 379,180 406,183 433,178 460,175 487,177 487,265" fill="rgba(59,130,246,0.12)"/>

  <!-- Secondary line (p99 latency) -->
  <polyline points="28,255 55,252 82,250 109,245 136,242 163,240 190,248 217,238 244,232 271,228 298,224 325,220 352,218 379,216 406,220 433,214 460,210 487,212" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>

  <!-- Legend -->
  <rect x="340" y="138" width="12" height="3" rx="1.5" fill="#3b82f6"/>
  <text x="356" y="148" fill="#9ca3af" font-size="9">req/s</text>
  <rect x="390" y="138" width="12" height="3" rx="1.5" fill="#f59e0b"/>
  <text x="406" y="148" fill="#9ca3af" font-size="9">p99 latency</text>

  <!-- Panel: CPU Usage -->
  <rect x="506" y="132" width="286" height="160" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="514" y="150" fill="#d1d5db" font-size="11" font-weight="700">CPU Usage — EKS Nodes</text>
  <text x="514" y="165" fill="#6b7280" font-size="10">Per node average</text>

  <!-- CPU bars -->
  <!-- Node 1 -->
  <text x="514" y="194" fill="#9ca3af" font-size="10">node-01</text>
  <rect x="570" y="183" width="200" height="12" rx="3" fill="#374151"/>
  <rect x="570" y="183" width="142" height="12" rx="3" fill="#10b981"/>
  <text x="778" y="194" fill="#34d399" font-size="10" text-anchor="end">71%</text>

  <!-- Node 2 -->
  <text x="514" y="214" fill="#9ca3af" font-size="10">node-02</text>
  <rect x="570" y="203" width="200" height="12" rx="3" fill="#374151"/>
  <rect x="570" y="203" width="156" height="12" rx="3" fill="#10b981"/>
  <text x="778" y="214" fill="#34d399" font-size="10" text-anchor="end">78%</text>

  <!-- Node 3 -->
  <text x="514" y="234" fill="#9ca3af" font-size="10">node-03</text>
  <rect x="570" y="223" width="200" height="12" rx="3" fill="#374151"/>
  <rect x="570" y="223" width="126" height="12" rx="3" fill="#f59e0b"/>
  <text x="778" y="234" fill="#fbbf24" font-size="10" text-anchor="end">63%</text>

  <!-- Node 4 (scaled up) -->
  <text x="514" y="254" fill="#9ca3af" font-size="10">node-04 <tspan fill="#6ee7b7" font-size="9">↑ NEW</tspan></text>
  <rect x="570" y="243" width="200" height="12" rx="3" fill="#374151"/>
  <rect x="570" y="243" width="72" height="12" rx="3" fill="#10b981"/>
  <text x="778" y="254" fill="#34d399" font-size="10" text-anchor="end">36%</text>

  <!-- Node average -->
  <rect x="514" y="270" width="268" height="14" rx="4" fill="rgba(59,130,246,0.1)"/>
  <text x="522" y="281" fill="#60a5fa" font-size="10">Average: 62% · HPA threshold: 75% · Scale-up trigger: Active</text>

  <!-- === ROW 3: EMQX + Redis + Alerts === -->

  <!-- Panel: EMQX Real-time Connections -->
  <rect x="8" y="300" width="250" height="140" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="16" y="318" fill="#d1d5db" font-size="11" font-weight="700">EMQX — Real-time Connections</text>

  <!-- Donut-style gauge -->
  <circle cx="100" cy="380" r="46" fill="none" stroke="#1f2937" stroke-width="12"/>
  <circle cx="100" cy="380" r="46" fill="none" stroke="#8b5cf6" stroke-width="12"
    stroke-dasharray="220 289" stroke-dashoffset="72" stroke-linecap="round"/>
  <text x="100" y="375" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">60.2K</text>
  <text x="100" y="392" fill="#9ca3af" font-size="10" text-anchor="middle">active conn.</text>

  <text x="174" y="345" fill="#9ca3af" font-size="10">Messages/s</text>
  <text x="174" y="362" fill="#c4b5fd" font-size="18" font-weight="800">184K</text>
  <text x="174" y="380" fill="#9ca3af" font-size="10">Subscribers</text>
  <text x="174" y="397" fill="#c4b5fd" font-size="18" font-weight="800">48,231</text>
  <text x="174" y="415" fill="#6b7280" font-size="9">Avg latency: 1.8ms</text>

  <!-- Panel: Redis Cache Hit Rate -->
  <rect x="266" y="300" width="250" height="140" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="274" y="318" fill="#d1d5db" font-size="11" font-weight="700">Redis — Cache Performance</text>

  <!-- Hit rate bar chart -->
  <text x="274" y="340" fill="#6b7280" font-size="10">Hit Rate (last 6h)</text>
  <rect x="274" y="348" width="234" height="50" fill="none"/>
  <!-- Bars -->
  <rect x="280" y="358" width="28" height="30" rx="3" fill="#3b82f6"/>
  <rect x="316" y="352" width="28" height="36" rx="3" fill="#3b82f6"/>
  <rect x="352" y="348" width="28" height="40" rx="3" fill="#3b82f6"/>
  <rect x="388" y="350" width="28" height="38" rx="3" fill="#3b82f6"/>
  <rect x="424" y="345" width="28" height="43" rx="3" fill="#60a5fa"/>
  <rect x="460" y="342" width="28" height="46" rx="3" fill="#60a5fa"/>
  <text x="280" y="403" fill="#6b7280" font-size="8">-5h</text>
  <text x="460" y="403" fill="#6b7280" font-size="8">now</text>

  <text x="274" y="425" fill="#9ca3af" font-size="10">Hit rate: <tspan fill="#34d399" font-weight="700">94.2%</tspan>  Memory: <tspan fill="#fbbf24" font-weight="700">68%</tspan>  Keys: <tspan fill="#c4b5fd" font-weight="700">2.1M</tspan></text>
  <text x="274" y="435" fill="#6b7280" font-size="9">CloudFront cache: 87.4% | Redis saves ~$420/mo</text>

  <!-- Panel: Alerts + Deployments -->
  <rect x="524" y="300" width="268" height="140" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="532" y="318" fill="#d1d5db" font-size="11" font-weight="700">Deployments &amp; Alerts</text>

  <!-- Recent deployments list -->
  <rect x="530" y="326" width="254" height="20" rx="4" fill="rgba(16,185,129,0.1)"/>
  <text x="538" y="340" fill="#34d399" font-size="10">✓ v2.8.4 deployed — 14m ago (blue-green, 0s downtime)</text>

  <rect x="530" y="350" width="254" height="20" rx="4" fill="rgba(16,185,129,0.1)"/>
  <text x="538" y="364" fill="#34d399" font-size="10">✓ v2.8.3 deployed — 2h ago (canary 100% traffic)</text>

  <rect x="530" y="374" width="254" height="20" rx="4" fill="rgba(245,158,11,0.1)"/>
  <text x="538" y="388" fill="#fbbf24" font-size="10">⚠ HPA scaled +2 nodes — 22m ago (traffic spike)</text>

  <rect x="530" y="398" width="254" height="20" rx="4" fill="rgba(16,185,129,0.1)"/>
  <text x="538" y="412" fill="#34d399" font-size="10">✓ SSL cert renewed — auto-rotated (Let's Encrypt)</text>

  <text x="532" y="432" fill="#6b7280" font-size="9">PagerDuty: 0 active incidents · Last alert: 6d ago</text>

  <!-- === ROW 4: Network + Cost + Logs === -->

  <!-- Panel: CloudFront Bandwidth -->
  <rect x="8" y="448" width="240" height="144" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="16" y="466" fill="#d1d5db" font-size="11" font-weight="700">CloudFront Bandwidth</text>
  <text x="16" y="498" fill="#60a5fa" font-size="28" font-weight="800">42.8 Gbps</text>
  <text x="16" y="516" fill="#93c5fd" font-size="10">↑ Peak: 68.2 Gbps (exam day)</text>
  <text x="16" y="535" fill="#9ca3af" font-size="10">18 edge locations · Avg TTL: 3600s</text>
  <!-- Mini gauge -->
  <rect x="16" y="548" width="220" height="8" rx="4" fill="#374151"/>
  <rect x="16" y="548" width="140" height="8" rx="4" fill="#3b82f6"/>
  <text x="238" y="558" fill="#60a5fa" font-size="9" text-anchor="end">63%</text>
  <text x="16" y="584" fill="#6b7280" font-size="9">Data Transfer Out (this month): 14.2 TB</text>

  <!-- Panel: AWS Cost Optimisation -->
  <rect x="256" y="448" width="264" height="144" rx="6" fill="url(#panelGrad)" stroke="#374151" stroke-width="1"/>
  <text x="264" y="466" fill="#d1d5db" font-size="11" font-weight="700">AWS Cost Optimisation</text>
  <text x="264" y="486" fill="#9ca3af" font-size="10">Monthly spend vs budget</text>
  <text x="264" y="514" fill="#34d399" font-size="24" font-weight="800">₹4.2L <tspan fill="#9ca3af" font-size="14">/ ₹5.0L</tspan></text>
  <text x="264" y="530" fill="#6ee7b7" font-size="10">↓ 16% under budget · Saved ₹0.8L this month</text>

  <text x="264" y="552" fill="#9ca3af" font-size="10">Savings via:</text>
  <text x="264" y="566" fill="#d1d5db" font-size="10">→ Reserved instances · Spot workers · Right-sizing</text>
  <text x="264" y="580" fill="#d1d5db" font-size="10">→ CloudFront cache (↓ origin hits 87%)</text>

  <!-- Panel: Live Logs (ELK) -->
  <rect x="528" y="448" width="264" height="144" rx="6" fill="#0d1117" stroke="#374151" stroke-width="1"/>
  <text x="536" y="466" fill="#d1d5db" font-size="11" font-weight="700">Live Logs — ELK Stack</text>

  <text x="536" y="486" fill="#34d399" font-size="10">14:22:08 INFO  [api] GET /stream/60241 200 12ms</text>
  <text x="536" y="500" fill="#34d399" font-size="10">14:22:08 INFO  [emqx] conn accepted 60842</text>
  <text x="536" y="514" fill="#f59e0b" font-size="10">14:22:07 WARN  [hpa] scaling: 2 new nodes joining</text>
  <text x="536" y="528" fill="#34d399" font-size="10">14:22:06 INFO  [api] POST /auth/login 200 24ms</text>
  <text x="536" y="542" fill="#34d399" font-size="10">14:22:05 INFO  [cdn] cache HIT /assets/v2.8.4/main.js</text>
  <text x="536" y="556" fill="#34d399" font-size="10">14:22:04 INFO  [api] GET /live/events 200 8ms</text>
  <text x="536" y="570" fill="#6b7280" font-size="10">14:22:03 DEBUG [route53] DNS TTL refreshed zone rdp.io</text>
  <text x="536" y="584" fill="#34d399" font-size="10">14:22:02 INFO  [deploy] v2.8.4 health check OK</text>
</svg>
